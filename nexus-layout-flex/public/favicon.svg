<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  <!-- Network icon -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center node -->
    <circle cx="50" cy="50" r="8" fill="white"/>
    <!-- Top node -->
    <circle cx="50" cy="25" r="6" fill="white"/>
    <!-- Bottom left node -->
    <circle cx="28" cy="68" r="6" fill="white"/>
    <!-- Bottom right node -->
    <circle cx="72" cy="68" r="6" fill="white"/>
    <!-- Connection lines -->
    <line x1="50" y1="42" x2="50" y2="31"/>
    <line x1="44" y1="56" x2="33" y2="63"/>
    <line x1="56" y1="56" x2="67" y2="63"/>
  </g>
</svg>

